body,
html {
  position: absolute;
  margin: 0;
  padding: 0;
  top: 0;
  right: 0;
  left: 0;
  bottom: 0;
  overflow: hidden;
  background: 0 0;

  touch-action: none;
  font-family: ui-font;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}

#ui {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 99;
  display: none;
}

.screen {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.cover {
  background: rgba(0, 0, 0, 0.5);
}

.center-absolute {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  top: 0;
  margin: auto;
}

.not-select {
  -moz-user-select: none;
  -webkit-user-select: none;
  user-select: none;
}

.hide {
  visibility: hidden;
  opacity: 0;
  transition: opacity 1s, visiblility 1s;
}

.show {
  visibility: visible;
  opacity: 1;
  transition: opacity 1s, visiblility 1s;
}

.simple-pulse {
  animation-name: pulse;
  animation-duration: 0.5s;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

#animation_container {
  position: absolute;
  margin: auto;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}

/*speaker********************/

.speaker {
  height: 30px;
  width: 30px;
  position: relative;
  overflow: hidden;
  display: inline-block;
}
.speaker span {
  display: block;
  width: 8px;
  height: 8px;
  background: #636363;
  margin: 11px 0 0 2px;
}
.speaker span:after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
  border-color: transparent #5d5d5d transparent transparent;
  border-width: 10px 14px 10px 15px;
  left: -13px;
  top: 5px;
}
.speaker span:before {
  transform: rotate(45deg);
  border-radius: 0 50px 0 0;
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border-style: double;
  border-color: #5d5d5d;
  border-width: 7px 7px 0 0;
  left: 18px;
  top: 9px;
  transition: all 0.2s ease-out;
}
.speaker:hover span:before {
  transform: scale(0.8) translate(-3px, 0) rotate(42deg);
}
.speaker.mute span:before {
  transform: scale(0.5) translate(-15px, 0) rotate(36deg);
  opacity: 0;
}

#speaker-btn {
  display: none;
  position: absolute;
  top: 17vmin;
  transform: scale(1.5);
  right: 5%;
  z-index: 1000;
}

		  toggle.addEventListener("click", toggleMenu);
		  levelLabel.addEventListener("click", toggleMenu);
		  levelLabel.addEventListener("keydown", event => {
		    if (event.key === "Enter" || event.key === " ") {
		      event.preventDefault();
		      toggleMenu();
		    }
		  });
		  document.addEventListener("click", event => {
		    if (!menu.contains(event.target) && !levelLabel.contains(event.target)) {
		      panel.hidden = true;
		      toggle.setAttribute("aria-expanded", "false");
		      levelLabel.setAttribute("aria-expanded", "false");
		    }
		  });
		  document.getElementById("game-menu-apply").addEventListener("click", () => {
		    const coins = Number(coinsInput.value);
		    const level = Number(levelInput.value);
		    const verticalFit = Number(verticalFitInput.value);
		    if (!Number.isSafeInteger(coins) || coins < 0) {
		      coinsInput.setCustomValidity("Enter a whole number of 0 or more.");
		      coinsInput.reportValidity();
		      return;
		    }
		    coinsInput.setCustomValidity("");
		    if (!Number.isInteger(level) || level < 1 || level > 330) {
		      levelInput.setCustomValidity("Enter a level from 1 to 330.");
		      levelInput.reportValidity();
		      return;
		    }
		    levelInput.setCustomValidity("");
		    if (!Number.isFinite(verticalFit) || verticalFit < 0.75 || verticalFit > 2.5) {
		      verticalFitInput.setCustomValidity("Enter a vertical fit coefficient from 0.75 to 2.5.");
		      verticalFitInput.reportValidity();
		      return;
		    }
		    verticalFitInput.setCustomValidity("");
		    localStorage.setItem("blackmaze-vertical-fit-v1", String(verticalFit));
		    localStorage.setItem("blackmaze-wall-sound-v1", wallSoundSelect.value);
		    localStorage.setItem("blackmaze-finish-sound-v1", finishSoundSelect.value);
		    localStorage.setItem("blackmaze-coin-sound-v1", coinSoundSelect.value);
		    const saved = window.blackMazeSavedProgress || {};
		    saved.coins = coins;
		    saved.gameSaveData = saved.gameSaveData || {};
		    saved.gameSaveData["0_lev"] = level - 1;
		    window.blackMazeSavedProgress = saved;
		    window.blackMazeCoinCount = coins;
		    if (window.blackMazeGameSaveData) {
		      window.blackMazeGameSaveData["0_lev"] = level - 1;
		      saved.gameSaveData = window.blackMazeGameSaveData;
		    }
		    if (typeof window.saveBlackMazeProgress === "function") window.saveBlackMazeProgress();
		    else localStorage.setItem(progressKey, JSON.stringify(saved));
		    window.location.reload();
		  });
		  document.getElementById("game-menu-reset").addEventListener("click", () => {
		    localStorage.removeItem(progressKey);
		    window.location.reload();
		  });
		})();
		</script>


		<div style="position: fixed; z-index: 5; color: white; display: none" id="asd">ASD</div>
	</body>
</html>
